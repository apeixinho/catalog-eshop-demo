openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0
  description: >
    Catalog and currency rates are public (`lang` selects translation locale with English fallback).
    Checkout and account order history require Bearer JWT with scope catalog.write.
    Manage orders and read customers require ROLE_MANAGER or ROLE_ADMIN; customer CRUD requires ROLE_ADMIN.
    Orders start PENDING; stock is decremented when payment-service calls the payment webhook
    with header X-Payment-Secret (no JWT).
servers:
  - url: http://localhost:8090
paths:
  /api/v1/products:
    get:
      summary: List active products
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/products/{id}:
    get:
      summary: Get product by id
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Product (empty body/optional when missing — prefer treating as not found)
  /api/v1/products/search/findByNameContaining:
    get:
      summary: Search products by name (any translation) or SKU
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/products/search/findByCategoryId:
    get:
      summary: Search active products by category
      security: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/product-category:
    get:
      summary: List categories
      security: []
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Categories
  /api/v1/countries:
    get:
      summary: List countries
      security: []
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Countries
  /api/v1/states/search/findByCountryCode:
    get:
      summary: States by country code
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: States
  /api/v1/currency/rates:
    get:
      summary: Fixed USD→currency demo rates used for display and checkout
      security: []
      responses:
        '200':
          description: Map of currency code to multiplier from USD
  /api/v1/checkout/purchase:
    post:
      summary: Create PENDING order and payment session (stock decremented on webhook)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Purchase'
      responses:
        '200':
          description: Tracking number and hosted payment URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Validation, inactive product, or insufficient stock
        '401':
          description: Missing or invalid JWT
  /api/v1/checkout/orders/{trackingNumber}:
    get:
      summary: Order payment status for the authenticated customer (SPA result page)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trackingNumber
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: Unknown order or not owned by caller
  /api/v1/checkout/payment-webhook:
    post:
      summary: Finalize payment from mock payment-service (shared secret, no JWT)
      security: []
      parameters:
        - in: header
          name: X-Payment-Secret
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Order finalized (PAID or CANCELLED)
        '401':
          description: Missing or invalid payment secret
        '409':
          description: Insufficient stock on SUCCEEDED (order CANCELLED)
  /api/v1/account/orders:
    get:
      summary: List authenticated shopper orders (newest first)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Page of order summaries
        '401':
          description: Missing or invalid JWT
  /api/v1/account/orders/{id}:
    get:
      summary: Order detail for the authenticated owner
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order detail
        '401':
          description: Missing or invalid JWT
        '404':
          description: Unknown order or not owned by caller
  /api/v1/manage/orders:
    get:
      summary: List all orders (manager or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Page of order summaries
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
  /api/v1/manage/orders/{id}:
    get:
      summary: Order detail (manager or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order detail
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
        '404':
          description: Unknown order
    put:
      summary: Update order status (manual cancel only)
      description: >
        Only PENDING → CANCELLED is allowed. PAID must come from the payment webhook;
        other transitions return 409 Conflict.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Updated order detail
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
        '404':
          description: Unknown order
        '409':
          description: Invalid status transition
    delete:
      summary: Delete order (restores stock when PAID)
      description: >
        PENDING orders cannot be deleted (409) — cancel first. Deleting a PAID order restores
        product stock before removal. Returns 409 if stock cannot be restored (e.g. product inactive).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Order deleted
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
        '404':
          description: Unknown order
        '409':
          description: Pending order, invalid transition, or could not restore stock
  /api/v1/manage/customers:
    get:
      summary: List customers (manager or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Page of customer summaries
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
  /api/v1/manage/customers/{id}:
    get:
      summary: Customer detail with order history (manager or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Customer detail
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_MANAGER or ROLE_ADMIN
        '404':
          description: Unknown customer
  /api/v1/admin/customers:
    post:
      summary: Create customer (admin)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created customer summary
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_ADMIN
  /api/v1/admin/customers/{id}:
    put:
      summary: Update customer (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated customer summary
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_ADMIN
        '404':
          description: Unknown customer
    delete:
      summary: Delete customer without orders (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Customer deleted
        '401':
          description: Missing or invalid JWT
        '403':
          description: Requires ROLE_ADMIN
        '404':
          description: Unknown customer
        '409':
          description: Customer has orders
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Purchase:
      type: object
      required: [customer, shippingAddress, billingAddress, orderItems, currencyCode]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        shippingAddress:
          $ref: '#/components/schemas/AddressRequest'
        billingAddress:
          $ref: '#/components/schemas/AddressRequest'
        orderItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        currencyCode:
          type: string
          enum: [USD, EUR, CAD, BRL, INR, TRY]
    CustomerRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
    AddressRequest:
      type: object
      required: [street, city, stateId, countryCode, zipCode]
      properties:
        street: { type: string }
        city: { type: string }
        stateId: { type: integer }
        countryCode: { type: string }
        zipCode: { type: string }
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
    PurchaseResponse:
      type: object
      required: [orderTrackingNumber, paymentUrl]
      properties:
        orderTrackingNumber: { type: string }
        paymentUrl: { type: string, format: uri }
    OrderStatusResponse:
      type: object
      required: [orderTrackingNumber, status]
      properties:
        orderTrackingNumber: { type: string }
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
    PaymentWebhookRequest:
      type: object
      required: [sessionId, status, orderTrackingNumber]
      properties:
        sessionId: { type: string }
        status:
          type: string
          enum: [SUCCEEDED, CANCELLED, FAILED]
        orderTrackingNumber: { type: string }
    UpdateOrderRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
    CustomerUpsertRequest:
      type: object
      required: [firstName, lastName, email, oauthSub]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        oauthSub: { type: string }
    CustomerSummary:
      type: object
      required: [id, firstName, lastName, email, orderCount]
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        orderCount: { type: integer, format: int64 }
    OrderSummary:
      type: object
      required: [id, orderTrackingNumber, status, totalPrice, currencyCode, totalQuantity, dateCreated]
      properties:
        id: { type: integer, format: int64 }
        orderTrackingNumber: { type: string }
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
        totalPrice: { type: number, format: double }
        currencyCode: { type: string }
        totalQuantity: { type: integer }
        dateCreated: { type: string, format: date-time }
    PageOrderSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
    PageCustomerSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummary'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
