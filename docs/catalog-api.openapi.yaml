openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0
  description: >
    Catalog and currency rates are public (`lang` selects translation locale with English fallback).
    Checkout purchase requires Bearer JWT with scope catalog.write and an Idempotency-Key header.
    Authenticated shoppers can poll GET /api/v1/checkout/orders/{trackingNumber} for payment status.
    Catalog unit prices are USD; checkout converts with fixed rates for currencyCode.
    Orders start PENDING; stock is decremented when payment-service calls the payment webhook
    with header X-Payment-Secret (no JWT).
servers:
  - url: http://localhost:8090
paths:
  /api/v1/products:
    get:
      summary: List active products
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/products/{id}:
    get:
      summary: Get product by id
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Product (empty body/optional when missing — prefer treating as not found)
  /api/v1/products/search/findByNameContaining:
    get:
      summary: Search products by name (any translation) or SKU
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/products/search/findByCategoryId:
    get:
      summary: Search active products by category
      security: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Page of products
  /api/v1/product-category:
    get:
      summary: List categories
      security: []
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Categories
  /api/v1/countries:
    get:
      summary: List countries
      security: []
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: Countries
  /api/v1/states/search/findByCountryCode:
    get:
      summary: States by country code
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string, enum: [en, pt, de, tr] }
      responses:
        '200':
          description: States
  /api/v1/currency/rates:
    get:
      summary: Fixed USD→currency demo rates used for display and checkout
      security: []
      responses:
        '200':
          description: Map of currency code to multiplier from USD
  /api/v1/checkout/purchase:
    post:
      summary: Create PENDING order and payment session (stock decremented on webhook)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Purchase'
      responses:
        '200':
          description: Tracking number and hosted payment URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Validation, inactive product, or insufficient stock
        '401':
          description: Missing or invalid JWT
  /api/v1/checkout/orders/{trackingNumber}:
    get:
      summary: Order payment status for the authenticated customer (SPA result page)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: trackingNumber
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: Unknown order or not owned by caller
  /api/v1/checkout/payment-webhook:
    post:
      summary: Finalize payment from mock payment-service (shared secret, no JWT)
      security: []
      parameters:
        - in: header
          name: X-Payment-Secret
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Order finalized (PAID or CANCELLED)
        '401':
          description: Missing or invalid payment secret
        '409':
          description: Insufficient stock on SUCCEEDED (order CANCELLED)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Purchase:
      type: object
      required: [customer, shippingAddress, billingAddress, orderItems, currencyCode]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        shippingAddress:
          $ref: '#/components/schemas/AddressRequest'
        billingAddress:
          $ref: '#/components/schemas/AddressRequest'
        orderItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        currencyCode:
          type: string
          enum: [USD, EUR, CAD, BRL, INR, TRY]
    CustomerRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
    AddressRequest:
      type: object
      required: [street, city, stateId, countryCode, zipCode]
      properties:
        street: { type: string }
        city: { type: string }
        stateId: { type: integer }
        countryCode: { type: string }
        zipCode: { type: string }
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
    PurchaseResponse:
      type: object
      required: [orderTrackingNumber, paymentUrl]
      properties:
        orderTrackingNumber: { type: string }
        paymentUrl: { type: string, format: uri }
    OrderStatusResponse:
      type: object
      required: [orderTrackingNumber, status]
      properties:
        orderTrackingNumber: { type: string }
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
    PaymentWebhookRequest:
      type: object
      required: [sessionId, status, orderTrackingNumber]
      properties:
        sessionId: { type: string }
        status:
          type: string
          enum: [SUCCEEDED, CANCELLED, FAILED]
        orderTrackingNumber: { type: string }
