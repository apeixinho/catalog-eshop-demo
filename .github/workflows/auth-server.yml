name: Auth Server CI

on:
  push:
    paths:
      - "auth-server/**"
      - ".github/workflows/auth-server.yml"
  pull_request:
    paths:
      - "auth-server/**"
      - ".github/workflows/auth-server.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test package
