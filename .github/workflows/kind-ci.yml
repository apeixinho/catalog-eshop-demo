# Kind / Helm smoke for the staging promotion lane (MariaDB stack on Kind).
# Runs on PRs and pushes to `staging` only (Compose staging smoke stays in Stack CI).
name: Kind CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

concurrency:
  group: kind-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind-staging:
    name: Kind staging smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: catalog-eshop
          config: deploy/kind/cluster-config.yaml

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s

      - name: Build staging images and load into Kind
        env:
          KIND_CLUSTER_NAME: catalog-eshop
          CONTAINER_CLI: docker
          IMAGE_PREFIX: ""
        run: bash deploy/kind/build-and-load.sh

      - name: Helm install
        run: |
          helm upgrade --install catalog-eshop deploy/helm/catalog-eshop \
            -n catalog-eshop --create-namespace \
            --wait --timeout 15m

      - name: Smoke checks
        run: |
          set -euo pipefail
          # Ingress can lag Deployment Available; retry until hosts answer 2xx.
          smoke_get() {
            local url="$1" out="$2"
            local i
            for i in $(seq 1 30); do
              if curl -sf --connect-timeout 2 --max-time 10 "$url" | tee "$out"; then
                echo
                return 0
              fi
              echo "retry ${i}/30: ${url}" >&2
              sleep 2
            done
            echo "smoke failed: ${url}" >&2
            curl -sS -D- --max-time 10 "$url" || true
            return 1
          }
          smoke_get http://auth.catalog.localhost/actuator/health /tmp/auth-health.json
          smoke_get http://payment.catalog.localhost/actuator/health /tmp/payment-health.json
          smoke_get http://api.catalog.localhost/actuator/health /tmp/backend-health.json
          smoke_get "http://api.catalog.localhost/api/v1/products?page=0&size=1" /tmp/products.json
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 10 http://catalog.localhost/ || true)
            echo "frontend HTTP ${code} (try ${i}/30)"
            case "${code}" in
              200|301|302) break ;;
            esac
            sleep 2
          done
          case "${code}" in
            200|301|302) ;;
            *) echo "unexpected frontend status ${code}"; exit 1 ;;
          esac

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n catalog-eshop get pods,svc,ingress,pvc -o wide || true
          kubectl -n ingress-nginx get pods -o wide || true
          kubectl -n catalog-eshop describe pods || true
          kubectl -n catalog-eshop describe ingress || true
          for d in mariadb auth-server payment-service backend frontend; do
            echo "===== logs $d ====="
            kubectl -n catalog-eshop logs "deploy/$d" --tail=120 || true
          done
