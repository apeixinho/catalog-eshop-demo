# Version updates target `dev` (promotion ladder: feature → dev → staging → main).
# Dependabot *security update* auto-PRs are disabled in repo Settings → Advanced Security
# because those PRs ignore this target-branch and open against the default branch (`main`).
# Keep Dependabot *alerts* enabled; apply security lockfile bumps via PRs into `dev`.
# See docs/branching-and-ci.md § Dependabot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
    # Pin exact versions in package.json; review grouped PRs before merge.
    versioning-strategy: increase

  - package-ecosystem: maven
    directory: /backend
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"

  - package-ecosystem: maven
    directory: /auth-server
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"

  - package-ecosystem: maven
    directory: /payment-service
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
