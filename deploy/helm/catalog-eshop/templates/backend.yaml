apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "catalog-eshop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "catalog-eshop.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: BACKEND_PORT
              value: "8090"
            - name: AUTH_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: AUTH_ISSUER_URI
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
            - name: OAUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: OAUTH_AUDIENCE
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: FRONTEND_ORIGIN
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: MARIADB_DATABASE
            - name: MARIADB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: MARIADB_USERNAME
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-eshop-secrets
                  key: MARIADB_PASSWORD
            - name: PAYMENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: PAYMENT_BASE_URL
            - name: PAYMENT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-eshop-secrets
                  key: PAYMENT_API_SECRET
            - name: PAYMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-eshop-secrets
                  key: PAYMENT_WEBHOOK_SECRET
            - name: PAYMENT_CHECKOUT_RESULT_URL
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: PAYMENT_CHECKOUT_RESULT_URL
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ include "catalog-eshop.serviceType" . }}
  selector:
    app.kubernetes.io/component: backend
    {{- include "catalog-eshop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: http
      {{- if not .Values.ingress.enabled }}
      nodePort: {{ .Values.nodePorts.backend }}
      {{- end }}
