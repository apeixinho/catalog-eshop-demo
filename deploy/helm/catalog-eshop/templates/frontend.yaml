apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "catalog-eshop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        {{- include "catalog-eshop.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: AUTH_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: AUTH_BROWSER_ISSUER_URI
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: API_BASE_URL
            - name: OAUTH_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: OAUTH_REDIRECT_URI
            - name: OAUTH_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: OAUTH_SCOPES
            - name: OAUTH_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: OAUTH_POST_LOGOUT_REDIRECT_URI
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: frontend
    {{- include "catalog-eshop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.nodePorts.frontend }}
