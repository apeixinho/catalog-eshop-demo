apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: payment-service
      {{- include "catalog-eshop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: payment-service
        {{- include "catalog-eshop.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: payment-service
          image: "{{ .Values.images.paymentService.repository }}:{{ .Values.images.paymentService.tag }}"
          imagePullPolicy: {{ .Values.images.paymentService.pullPolicy }}
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: PAYMENT_SERVER_PORT
              value: "8091"
            - name: PAYMENT_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: PAYMENT_PUBLIC_BASE_URL
            - name: PAYMENT_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: catalog-eshop-config
                  key: PAYMENT_WEBHOOK_URL
            - name: PAYMENT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-eshop-secrets
                  key: PAYMENT_API_SECRET
            - name: PAYMENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-eshop-secrets
                  key: PAYMENT_WEBHOOK_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.paymentService | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    {{- include "catalog-eshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-service
spec:
  type: {{ include "catalog-eshop.serviceType" . }}
  selector:
    app.kubernetes.io/component: payment-service
    {{- include "catalog-eshop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8091
      targetPort: http
      {{- if not .Values.ingress.enabled }}
      nodePort: {{ .Values.nodePorts.payment }}
      {{- end }}
