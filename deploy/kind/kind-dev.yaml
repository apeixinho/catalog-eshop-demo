# Durable shared Kind cluster for local multi-app development (Podman or Docker).
# Create once; deploy apps into namespaces. Do NOT delete this cluster to uninstall an app.
#
# Host ports 80/443 → ingress-nginx only. Apps use Ingress hostnames (*.localhost),
# so this cluster does not fight Compose on 4200/8090/8091/9000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
