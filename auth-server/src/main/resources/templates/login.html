<!DOCTYPE html>
<html th:lang="${#locale.language}" th:class="'theme-' + ${theme}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" th:content="${theme == 'alternative'} ? '#c2410c' : '#1b7a4a'"/>
  <title th:text="#{login.title}">Catalog Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Sora:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
  <div class="login">
    <form class="login__form" th:action="@{/login}" method="post">
      <h1 class="login__brand" th:text="#{login.brand}">Catalog</h1>
      <p class="login__lede" th:text="#{login.lede}">Sign in to complete checkout</p>
      <div class="login__error" th:if="${param.error}" th:text="#{login.error}">Invalid username or password</div>
      <label class="login__field" for="username">
        <span th:text="#{login.username}">Username</span>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus/>
      </label>
      <label class="login__field" for="password">
        <span th:text="#{login.password}">Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
      </label>
      <button type="submit" th:text="#{login.submit}">Sign in</button>
    </form>
    <p class="login__cancel">
      <a th:href="${shopUrl}" th:text="#{login.cancel}">Continue shopping</a>
    </p>
  </div>
</body>
</html>
