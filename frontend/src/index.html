<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Catalog</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    try {
      var theme = localStorage.getItem('catalog.theme');
      if (theme === 'catalog') theme = 'default';
      if (theme === 'application') theme = 'alternative';
      if (theme === 'default' || theme === 'alternative') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', 'default');
      }
    } catch (e) {}
  </script>
  <script src="/env.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
