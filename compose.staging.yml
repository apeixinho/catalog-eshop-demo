# Staging stack: MariaDB + Spring staging profiles + nginx SPA
# Separate Compose project from compose.dev.yml (do not run both at once — same host ports).
name: eshop-staging

services:
  mariadb:
    image: mariadb:10
    container_name: eshop-mariadb-staging
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-catalog_db}
      MARIADB_USER: ${MARIADB_USERNAME:-catalog_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-catalog_pass}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-catalog_root_pass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data_staging:/var/lib/mysql
      - ./auth-server/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s

  auth-server:
    image: eshop-auth-server:staging
    build:
      context: ./auth-server
      dockerfile: Dockerfile.staging
    container_name: eshop-auth-server-staging
    ports:
      - "${AUTH_SERVER_PORT:-9000}:9000"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      AUTH_SERVER_PORT: 9000
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-catalog-spa}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-catalog-api}
      AUTH_MARIADB_DATABASE: ${AUTH_MARIADB_DATABASE:-catalog_auth}
      MARIADB_USERNAME: ${MARIADB_USERNAME:-catalog_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-catalog_pass}
      AUTH_JWK_PATH: /opt/app/data/auth-jwk.json
    volumes:
      - auth_jwk_staging:/opt/app/data
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  payment-service:
    image: eshop-payment-service:staging
    build:
      context: ./payment-service
      dockerfile: Dockerfile.staging
    container_name: eshop-payment-service-staging
    ports:
      - "${PAYMENT_SERVER_PORT:-8091}:8091"
    environment:
      PAYMENT_SERVER_PORT: 8091
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-http://localhost:8091}
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-http://backend:8090/api/v1/checkout/payment-webhook}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-payment-secret}
      PAYMENT_API_SECRET: ${PAYMENT_API_SECRET:-dev-payment-secret}
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  backend:
    image: eshop-backend:staging
    build:
      context: ./backend
      dockerfile: Dockerfile.staging
    container_name: eshop-backend-staging
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      BACKEND_PORT: 8090
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-catalog-api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-catalog_db}
      MARIADB_USERNAME: ${MARIADB_USERNAME:-catalog_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-catalog_pass}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-http://payment-service:8091}
      PAYMENT_API_SECRET: ${PAYMENT_API_SECRET:-dev-payment-secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-payment-secret}
      PAYMENT_CHECKOUT_RESULT_URL: ${PAYMENT_CHECKOUT_RESULT_URL:-http://localhost:4200/checkout/result}
    depends_on:
      mariadb:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    # nginx listens on 80 inside the image — host :4200 maps to container :80
    image: eshop-frontend:staging
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
    container_name: eshop-frontend-staging
    ports:
      - "4200:80"
    environment:
      AUTH_ISSUER_URI: ${AUTH_BROWSER_ISSUER_URI:-http://localhost:9000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8090}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-catalog-spa}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:4200/auth/callback}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile catalog.read catalog.write}
    depends_on:
      - backend
    networks:
      - eshop-network
    restart: unless-stopped

volumes:
  mariadb_data_staging:
  auth_jwk_staging:

networks:
  eshop-network:
    driver: bridge
